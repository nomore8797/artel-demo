name: SLSA Generic (artel-demo)

on:
  workflow_dispatch:
  push:
    branches: [ "main" ]

permissions:
  contents: write
  id-token: write

jobs:
  build:
    runs-on: ubuntu-latest

    outputs:
      digests: ${{ steps.hash.outputs.digests }}

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Prepare artifacts
        run: |
          set -e
          cp artel_mini.py artifact_artel_mini.py
          cp slsa-generic.yml artifact_slsa-generic.yml

      - name: Generate SHA256 digests
        id: hash
        shell: bash
        run: |
          set -euo pipefail
          files="artifact_artel_mini.py artifact_slsa-generic.yml"
          digests=$(sha256sum $files | awk '{print $1}' | base64 -w0)
          echo "digests=$digests" >> "$GITHUB_OUTPUT"

  provenance:
    needs: build
    runs-on: ubuntu-latest

    steps:
      - name: Generate SLSA provenance
        uses: slsa-framework/slsa-github-generator/actions/generator@v2
        with:
          base64-subjects: ${{ needs.build.outputs.digests }}
          upload-assets: true