name: SLSA generic generator

on:
  workflow_dispatch:
  release:
    types: [created]

permissions:
  contents: read
  id-token: write

jobs:
  build:
    runs-on: windows-latest
    outputs:
      digests: ${{ steps.hash.outputs.digests }}

    steps:
      - uses: actions/checkout@v4

      - name: Build artifacts
        run: |
          Copy-Item artel_mini.py artifact_artel_mini.py
          Copy-Item slsa-generic.yml artifact_slsa-generic.yml
          "artifact1" | Out-File artifact1
          "artifact2" | Out-File artifact2

      - name: Generate subject for provenance
        id: hash
        shell: pwsh
        run: |
          $files = @(
            "artifact_artel_mini.py",
            "artifact_slsa-generic.yml",
            "artifact1",
            "artifact2"
          )
          $hashes = $files | ForEach-Object { 
            $bytes = Get-Content $_ -Raw -Encoding UTF8 | ForEach-Object { [byte[]][char[]]$_ }
            $hash = [System.Security.Cryptography.SHA256]::Create().ComputeHash($bytes)
            [System.Convert]::ToBase64String($hash)
          } 
          $hashes_str = $hashes -join ","
          Write-Output "digests=$hashes_str"
          echo "digests=$hashes_str" >> $env:GITHUB_OUTPUT

  provenance:
    needs: build
    permissions:
      actions: read
      id-token: write
      contents: write
    uses: slsa-framework/slsa-github-generator/.github/workflows/generator_generic_slsa3.yml@v2
    with:
      base64-subjects: ${{ needs.build.outputs.digests }}
      upload-assets: true