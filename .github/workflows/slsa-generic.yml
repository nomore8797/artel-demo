name: SLSA generic generator

on:
  workflow_dispatch:
  release:
    types: [created]

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    outputs:
      digests: ${{ steps.hash.outputs.digests }}
    steps:
      - uses: actions/checkout@v4

      # ========================================================
      # Step 1: Build your artifacts
      # ========================================================
      - name: Build artifacts
        run: |
          # Copy files for signing
          cp artel_mini.py artifact_artel_mini.py
          cp slsa-generic.yml artifact_slsa-generic.yml
          # Create dummy artifacts for SLSA
          echo "artifact1" > artifact1
          echo "artifact2" > artifact2

      # ========================================================
      # Step 2: Generate subject for SLSA
      # ========================================================
      - name: Generate subject for provenance
        id: hash
        shell: bash
        run: |
          set -euo pipefail
          files="artifact_artel_mini.py artifact_slsa-generic.yml"
          digests=$(sha256sum $files | awk '{print $1}' | base64)
          echo "digests=$digests" >> $GITHUB_OUTPUT
          files=$(ls artifact*)
          echo "hashes=$(sha256sum $files | base64 -w0)" >> "${GITHUB_OUTPUT}"

  provenance:
    needs: build
    permissions:
      actions: read
      id-token: write
      contents: write
    uses: slsa-framework/slsa-github-generator/.github/workflows/generator_generic_slsa3.yml@v1.4.0
    with:
      base64-subjects: "${{ needs.build.outputs.digests }}"
      upload-assets: true