name: SLSA OSSF generator
on:
  workflow_dispatch:
  release:
    types: [created]

jobs:
  detect-env:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Detect environment
        run: |
          echo "Environment detected"

  create-release:
    needs: detect-env
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Create GitHub release
        uses: actions/create-release@v1
        with:
          tag_name: v1.0.0
          release_name: "Automated Release"
          draft: false
          prerelease: false